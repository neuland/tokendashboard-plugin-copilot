name: tokendashboard-plugin-copilot
services:
  dev:
    build:
      context: .
    container_name: tokendashboard-plugin-copilot-dev
    hostname: dev
    volumes:
      - ..:/workspaces/tokendashboard-plugin-copilot
      - ~/.claude:/home/vscode/.claude
      - ~/.claude.json:/tmp/host-claude.json:ro
    environment:
      - NODE_ENV=development
    command: sleep infinity
    restart: unless-stopped
